
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALPA Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#030712;font-family:'IBM Plex Sans',sans-serif;direction:rtl;}
.bounce{animation:bounce 1s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
textarea{font-family:inherit;}
select option{background:#111;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const ADMIN_PASSWORD = "alpa2024";

const FILE_CATEGORIES = [
  { id: "planogram", label: "פלנוגרמה", emoji: "📋", bg: "#1e3a5f", border: "#2563eb" },
  { id: "order",     label: "הזמנה",    emoji: "📦", bg: "#3d2a0a", border: "#d97706" },
  { id: "activity",  label: "פעילות",   emoji: "📝", bg: "#0a3d2a", border: "#059669" },
  { id: "price",     label: "מחירון",   emoji: "💰", bg: "#2d1a4d", border: "#9333ea" },
  { id: "other",     label: "אחר",      emoji: "📄", bg: "#1a1a1a", border: "#6b7280" },
];

const SYSTEM_PROMPT = `אתה עוזר חכם של ALPA לעובדי שטח ומנהלים.
יש לך גישה לרשימת הקבצים הבאים:
{FILES_LIST}

כשמישהו מבקש קובץ:
1. חפש בין הקבצים הרלוונטיים
2. אם מצאת — ציין את שם הקובץ המדויק בתשובתך כך: [FILE:id_של_הקובץ]
3. אם לא מצאת — אמור זאת בנימוס והצע חלופות

ענה תמיד בעברית, קצר וברור. אתה יכול גם לענות על שאלות כלליות הקשורות לעבודה בשטח.`;

const ANALYSIS_PROMPT = `אתה מנתח תמונות שטח עבור ALPA.
בדוק את התמונה ודווח על:
1. האם הפלנוגרמה מיושמת נכון (סדר מוצרים, מיקום, כמויות)
2. האם התמונה מראה את מה שאמור להיות מצולם בפעילות
3. מה חסר או לא תקין

ענה בעברית, קצר וברור. השתמש ב-✅ לדברים תקינים ו-⚠️ לבעיות.`;

function buildSystemPrompt(files) {
  if (!files.length) return SYSTEM_PROMPT.replace("{FILES_LIST}", "אין קבצים כרגע.");
  const list = files.map(f => {
    const cat = FILE_CATEGORIES.find(c => c.id === f.category);
    return `- [${f.id}] ${f.name} (${cat ? cat.label : ""}) ${f.branch ? "| סניף: " + f.branch : ""} | הועלה: ${new Date(f.uploadedAt).toLocaleDateString("he-IL")}`;
  }).join("\n");
  return SYSTEM_PROMPT.replace("{FILES_LIST}", list);
}

function extractFileRef(text) {
  const match = text.match(/\[FILE:([^\]]+)\]/g);
  return match ? match.map(m => m.replace("[FILE:", "").replace("]", "")) : [];
}

function cleanText(text) {
  return text.replace(/\[FILE:[^\]]+\]/g, "").trim();
}

function Avatar({ letter }) {
  return (
    <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#f97316,#f43f5e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",flexShrink:0}}>
      {letter}
    </div>
  );
}

function FileBadge({ file }) {
  const cat = FILE_CATEGORIES.find(c => c.id === file.category);
  return (
    <a href={file.url} download={file.name} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.07)",color:"#e5e7eb",fontSize:12,fontWeight:500,textDecoration:"none",cursor:"pointer"}}>
      <span>{cat ? cat.emoji : "📄"}</span>
      <span>{file.name}</span>
      <span style={{color:"#9ca3af"}}>↓ הורד</span>
    </a>
  );
}

function FileCard({ file, onDelete }) {
  const cat = FILE_CATEGORIES.find(c => c.id === file.category);
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{background:hover?"rgba(255,255,255,0.07)":"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,transition:"background 0.2s"}}>
      <div style={{width:36,height:36,borderRadius:8,background:cat?cat.bg:"#1a1a1a",border:`1px solid ${cat?cat.border:"#6b7280"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
        {cat ? cat.emoji : "📄"}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:500,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{file.name}</div>
        <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>
          {cat ? cat.label : "אחר"}{file.branch ? ` · סניף ${file.branch}` : ""} · {new Date(file.uploadedAt).toLocaleDateString("he-IL")}
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <a href={file.url} download={file.name} style={{color:"#6b7280",fontSize:14,textDecoration:"none"}}>↓</a>
        {onDelete && <button onClick={() => onDelete(file.id)} style={{color:hover?"#f87171":"transparent",background:"none",border:"none",cursor:"pointer",fontSize:14,transition:"color 0.2s"}}>✕</button>}
      </div>
    </div>
  );
}

function ChatMessage({ msg, files }) {
  const isUser = msg.role === "user";
  const referencedFiles = (msg.fileRefs || []).map(id => files.find(f => f.id === id)).filter(Boolean);
  return (
    <div style={{display:"flex",gap:10,flexDirection:isUser?"row-reverse":"row",marginBottom:16}}>
      {!isUser && <Avatar letter="A" />}
      <div style={{maxWidth:"78%",display:"flex",flexDirection:"column",gap:8,alignItems:isUser?"flex-end":"flex-start"}}>
        {msg.image && <img src={msg.image} alt="" style={{maxWidth:180,borderRadius:12,border:"1px solid rgba(255,255,255,0.1)",objectFit:"cover"}}/>}
        {msg.content && (
          <div style={{padding:"10px 16px",borderRadius:18,fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap",
            background:isUser?"#f97316":"rgba(255,255,255,0.07)",
            color:isUser?"#fff":"#f3f4f6",
            border:isUser?"none":"1px solid rgba(255,255,255,0.1)",
            borderTopRightRadius:isUser?4:18,
            borderTopLeftRadius:isUser?18:4}}>
            {msg.content}
          </div>
        )}
        {referencedFiles.length > 0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {referencedFiles.map(f => <FileBadge key={f.id} file={f}/>)}
          </div>
        )}
        {msg.loading && (
          <div style={{padding:"10px 16px",borderRadius:18,borderTopLeftRadius:4,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",display:"flex",gap:4,alignItems:"center"}}>
            {[0,150,300].map(d => <span key={d} className="bounce" style={{width:6,height:6,borderRadius:"50%",background:"#6b7280",display:"inline-block",animationDelay:d+"ms"}}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("login");
  const [userName, setUserName] = useState("");
  const [adminPass, setAdminPass] = useState("");
  const [adminError, setAdminError] = useState("");
  const [files, setFiles] = useState([]);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [chatImage, setChatImage] = useState(null);
  const messagesEndRef = useRef(null);
  const chatFileRef = useRef(null);
  const [uploadName, setUploadName] = useState("");
  const [uploadCategory, setUploadCategory] = useState("planogram");
  const [uploadBranch, setUploadBranch] = useState("");
  const [uploadFile, setUploadFile] = useState(null);
  const [uploadFileName, setUploadFileName] = useState("");
  const [uploading, setUploading] = useState(false);
  const adminFileRef = useRef(null);
  const [analyzeImage, setAnalyzeImage] = useState(null);
  const [activityDesc, setActivityDesc] = useState("");
  const [analyzing, setAnalyzing] = useState(false);
  const [analysisResult, setAnalysisResult] = useState(null);
  const analyzeFileRef = useRef(null);

  useEffect(() => { messagesEndRef.current && messagesEndRef.current.scrollIntoView({behavior:"smooth"}); }, [messages]);

  function loginWorker() {
    if (!userName.trim()) return;
    setMessages([{role:"assistant",content:`שלום ${userName}! 👋\nאני העוזר החכם של ALPA.\nאני יכול לשלוח לך פלנוגרמות, הזמנות, הוראות פעילות ועוד.\nמה אפשר לעזור?`}]);
    setScreen("chat");
  }

  function loginAdmin() {
    if (adminPass === ADMIN_PASSWORD) { setScreen("admin"); setAdminError(""); }
    else setAdminError("סיסמה שגויה");
  }

  function handleAdminFileSelect(e) {
    const f = e.target.files[0]; if (!f) return;
    setUploadFile(f); setUploadFileName(f.name);
    if (!uploadName) setUploadName(f.name.replace(/\.[^.]+$/, ""));
  }

  function doUpload() {
    if (!uploadFile || !uploadName.trim()) return;
    setUploading(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      setFiles(prev => [{id:"file_"+Date.now(),name:uploadName.trim(),category:uploadCategory,branch:uploadBranch.trim(),url:e.target.result,uploadedAt:Date.now()}, ...prev]);
      setUploadName(""); setUploadBranch(""); setUploadFile(null); setUploadFileName(""); setUploading(false);
    };
    reader.readAsDataURL(uploadFile);
  }

  async function sendMessage() {
    if (!input.trim() && !chatImage) return;
    const userText = input.trim(); setInput("");
    const userMsg = {role:"user", content:userText, image:chatImage};
    const newMessages = [...messages, userMsg];
    setMessages([...newMessages, {role:"assistant", loading:true}]);
    setChatLoading(true); setChatImage(null);
    try {
      const apiMessages = newMessages.map(m => ({
        role: m.role,
        content: m.image
          ? [{type:"image",source:{type:"base64",media_type:"image/jpeg",data:m.image.split(",")[1]}},{type:"text",text:m.content||"תמונה"}]
          : (m.content||"")
      }));
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:buildSystemPrompt(files),messages:apiMessages})
      });
      const data = await res.json();
      const raw = (data.content||[]).map(c=>c.text||"").join("") || "מצטער, לא הצלחתי לענות.";
      const fileRefs = extractFileRef(raw);
      const clean = cleanText(raw);
      setMessages(prev => [...prev.filter(m=>!m.loading), {role:"assistant",content:clean,fileRefs}]);
    } catch(e) {
      setMessages(prev => [...prev.filter(m=>!m.loading), {role:"assistant",content:"שגיאה בחיבור, נסה שוב."}]);
    }
    setChatLoading(false);
  }

  async function doAnalyze() {
    if (!analyzeImage) return;
    setAnalyzing(true); setAnalysisResult(null);
    try {
      const prompt = activityDesc ? `הפעילות שאמורה להיות מצולמת: ${activityDesc}\n\n${ANALYSIS_PROMPT}` : ANALYSIS_PROMPT;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:analyzeImage.split(",")[1]}},
          {type:"text",text:prompt}
        ]}]})
      });
      const data = await res.json();
      setAnalysisResult((data.content||[]).map(c=>c.text||"").join("")||"לא הצלחתי לנתח.");
    } catch(e) { setAnalysisResult("שגיאה בניתוח, נסה שוב."); }
    setAnalyzing(false);
  }

  const S = { // styles
    page: {minHeight:"100vh",background:"#030712",color:"#fff"},
    header: {borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(17,24,39,0.9)",position:"sticky",top:0,zIndex:10},
    logo: {width:32,height:32,borderRadius:10,background:"linear-gradient(135deg,#f97316,#f43f5e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff"},
    input: {width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 12px",fontSize:13,color:"#fff",outline:"none",fontFamily:"inherit"},
    btn: {width:"100%",background:"linear-gradient(135deg,#f97316,#f43f5e)",border:"none",borderRadius:12,padding:"11px",fontSize:13,fontWeight:600,color:"#fff",cursor:"pointer"},
    card: {background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:16,padding:"18px"},
  };

  // LOGIN
  if (screen === "login") return (
    <div style={{...S.page,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:340}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:32,justifyContent:"center"}}>
          <div style={{...S.logo,width:48,height:48,borderRadius:14,fontSize:20,boxShadow:"0 8px 24px rgba(249,115,22,0.3)"}}>A</div>
          <div><div style={{fontSize:24,fontWeight:700,letterSpacing:-0.5}}>ALPA</div><div style={{fontSize:12,color:"#6b7280"}}>מערכת שטח חכמה</div></div>
        </div>
        <div style={{...S.card,marginBottom:10}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>כניסת עובד / מנהל</div>
          <input style={{...S.input,marginBottom:10}} value={userName} onChange={e=>setUserName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&loginWorker()} placeholder="שם מלא"/>
          <button style={{...S.btn,opacity:userName.trim()?1:0.4}} onClick={loginWorker}>כניסה לצ'אט</button>
        </div>
        <div style={{...S.card,background:"rgba(255,255,255,0.02)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#9ca3af",marginBottom:12}}>ניהול קבצים (משרד)</div>
          <input style={{...S.input,marginBottom:10}} type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&loginAdmin()} placeholder="סיסמת ניהול"/>
          {adminError && <div style={{color:"#f87171",fontSize:12,marginBottom:8}}>{adminError}</div>}
          <button style={{...S.btn,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)"}} onClick={loginAdmin}>כניסת ניהול</button>
        </div>
      </div>
    </div>
  );

  // ADMIN
  if (screen === "admin") return (
    <div style={S.page}>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><div style={S.logo}>A</div><span style={{fontWeight:600,fontSize:14}}>ניהול קבצים — ALPA</span></div>
        <button onClick={()=>setScreen("login")} style={{background:"none",border:"none",color:"#6b7280",cursor:"pointer",fontSize:12}}>יציאה</button>
      </div>
      <div style={{maxWidth:520,margin:"0 auto",padding:"24px 16px",display:"flex",flexDirection:"column",gap:20}}>
        <div style={S.card}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:14}}>העלאת קובץ חדש</div>
          <div onClick={()=>adminFileRef.current.click()} style={{border:"2px dashed rgba(255,255,255,0.12)",borderRadius:10,padding:16,textAlign:"center",cursor:"pointer",marginBottom:12}}>
            {uploadFileName ? <span style={{fontSize:13,color:"#fb923c"}}>📎 {uploadFileName}</span>
              : <><div style={{fontSize:13,color:"#6b7280"}}>לחץ לבחירת קובץ</div><div style={{fontSize:11,color:"#374151",marginTop:4}}>PDF, Excel, תמונה וכו'</div></>}
          </div>
          <input ref={adminFileRef} type="file" style={{display:"none"}} onChange={handleAdminFileSelect}/>
          <input style={{...S.input,marginBottom:10}} value={uploadName} onChange={e=>setUploadName(e.target.value)} placeholder="שם הקובץ"/>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <select value={uploadCategory} onChange={e=>setUploadCategory(e.target.value)} style={{...S.input,flex:1}}>
              {FILE_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
            </select>
            <input style={{...S.input,width:110}} value={uploadBranch} onChange={e=>setUploadBranch(e.target.value)} placeholder="סניף (אופ')"/>
          </div>
          <button style={{...S.btn,opacity:(!uploadFile||!uploadName.trim()||uploading)?0.4:1}} onClick={doUpload}>{uploading?"מעלה...":"העלה קובץ"}</button>
        </div>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:"#9ca3af",marginBottom:10}}>קבצים במערכת ({files.length})</div>
          {files.length===0
            ? <div style={{fontSize:12,color:"#4b5563",textAlign:"center",padding:24,border:"1px solid rgba(255,255,255,0.07)",borderRadius:12}}>אין קבצים עדיין</div>
            : <div style={{display:"flex",flexDirection:"column",gap:8}}>{files.map(f=><FileCard key={f.id} file={f} onDelete={id=>setFiles(prev=>prev.filter(f=>f.id!==id))}/>)}</div>}
        </div>
      </div>
    </div>
  );

  // CHAT + ANALYZE
  return (
    <div style={{...S.page,display:"flex",flexDirection:"column"}}>
      <div style={S.header}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={S.logo}>A</div>
          <div><div style={{fontWeight:600,fontSize:13}}>ALPA Assistant</div><div style={{fontSize:11,color:"#4ade80",display:"flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:"#4ade80",display:"inline-block"}}/>שלום, {userName}</div></div>
        </div>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.05)",borderRadius:12,padding:4}}>
          {["chat","analyze"].map(s=>(
            <button key={s} onClick={()=>setScreen(s)} style={{padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:500,border:"none",cursor:"pointer",background:screen===s?"#f97316":"transparent",color:screen===s?"#fff":"#6b7280",transition:"all 0.2s"}}>
              {s==="chat"?"💬 צ'אט":"📸 ניתוח"}
            </button>
          ))}
        </div>
      </div>

      {screen==="chat" && <>
        <div style={{flex:1,overflowY:"auto",padding:"16px 16px 0"}}>
          {messages.map((m,i)=><ChatMessage key={i} msg={m} files={files}/>)}
          <div ref={messagesEndRef}/>
        </div>
        {chatImage && (
          <div style={{padding:"0 16px 8px",display:"flex",alignItems:"center",gap:8}}>
            <div style={{position:"relative"}}>
              <img src={chatImage} alt="" style={{width:44,height:44,borderRadius:8,objectFit:"cover",border:"1px solid rgba(255,255,255,0.2)"}}/>
              <button onClick={()=>setChatImage(null)} style={{position:"absolute",top:-6,right:-6,width:16,height:16,borderRadius:"50%",background:"#1f2937",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",fontSize:9,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>
            <span style={{fontSize:11,color:"#6b7280"}}>תמונה מצורפת</span>
          </div>
        )}
        <div style={{padding:"8px 16px 16px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
          <div style={{display:"flex",gap:8,alignItems:"flex-end",background:"rgba(255,255,255,0.06)",borderRadius:16,border:"1px solid rgba(255,255,255,0.1)",padding:"8px 12px",marginBottom:8}}>
            <button onClick={()=>chatFileRef.current.click()} style={{background:"none",border:"none",color:"#6b7280",cursor:"pointer",fontSize:18,flexShrink:0,marginBottom:2}}>📎</button>
            <input ref={chatFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setChatImage(ev.target.result);r.readAsDataURL(f);}}/>
            <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}} placeholder="שאל משהו או בקש קובץ..." rows={1} style={{flex:1,background:"transparent",border:"none",fontSize:13,color:"#fff",outline:"none",resize:"none",maxHeight:80,overflowY:"auto",lineHeight:1.5,fontFamily:"inherit"}}/>
            <button onClick={sendMessage} disabled={chatLoading||(!input.trim()&&!chatImage)} style={{background:"#f97316",border:"none",borderRadius:10,padding:"6px 12px",fontSize:12,fontWeight:600,color:"#fff",cursor:"pointer",opacity:(chatLoading||(!input.trim()&&!chatImage))?0.4:1,flexShrink:0}}>שלח</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {files.slice(0,3).map(f=>{const cat=FILE_CATEGORIES.find(c=>c.id===f.category);return(
              <button key={f.id} onClick={()=>setInput(`תשלח לי את ${f.name}`)} style={{fontSize:11,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"4px 10px",color:"#9ca3af",cursor:"pointer",maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {cat?cat.emoji:"📄"} {f.name}
              </button>
            );})}
            {files.length===0 && <span style={{fontSize:11,color:"#374151"}}>אין קבצים עדיין — המשרד צריך להעלות</span>}
          </div>
        </div>
      </>}

      {screen==="analyze" && (
        <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:14}}>
          <div onClick={()=>analyzeFileRef.current.click()} style={{border:"2px dashed rgba(255,255,255,0.12)",borderRadius:16,padding:24,textAlign:"center",cursor:"pointer"}}>
            {analyzeImage
              ? <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><img src={analyzeImage} alt="" style={{maxHeight:200,borderRadius:12,objectFit:"contain"}}/><span style={{fontSize:11,color:"#6b7280"}}>לחץ להחלפה</span></div>
              : <><div style={{fontSize:36,marginBottom:8}}>📸</div><div style={{fontSize:13,fontWeight:500,color:"#d1d5db"}}>העלה תמונה מהשטח</div><div style={{fontSize:11,color:"#6b7280",marginTop:4}}>Claude ינתח אם הכל בסדר</div></>}
          </div>
          <input ref={analyzeFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setAnalyzeImage(ev.target.result);setAnalysisResult(null);};r.readAsDataURL(f);}}/>
          <input style={S.input} value={activityDesc} onChange={e=>setActivityDesc(e.target.value)} placeholder="תאר את הפעילות (אופציונלי) — לדוג': הצבת שלט קמפיין"/>
          <button style={{...S.btn,opacity:(!analyzeImage||analyzing)?0.4:1}} onClick={doAnalyze}>{analyzing?"מנתח...":"🔍 נתח תמונה"}</button>
          {analyzing && (
            <div style={{...S.card,display:"flex",alignItems:"center",gap:12}}>
              <Avatar letter="A"/>
              <div style={{display:"flex",gap:4}}>{[0,150,300].map(d=><span key={d} className="bounce" style={{width:7,height:7,borderRadius:"50%",background:"#6b7280",display:"inline-block",animationDelay:d+"ms"}}/>)}</div>
            </div>
          )}
          {analysisResult && (
            <div style={S.card}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><Avatar letter="A"/><span style={{fontSize:11,fontWeight:600,color:"#fb923c"}}>תוצאות ניתוח</span></div>
              <div style={{fontSize:13,color:"#e5e7eb",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{analysisResult}</div>
              <button onClick={()=>{setAnalyzeImage(null);setAnalysisResult(null);setActivityDesc("");}} style={{background:"none",border:"none",color:"#6b7280",cursor:"pointer",fontSize:11,marginTop:10}}>ניתוח חדש</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
